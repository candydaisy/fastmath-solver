<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main class="panel">

  <header class="panel__header">
    <h1>FastMath</h1>
    <p class="subtitle">give it numbers, get an expression back</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-mode="classic" role="tab" aria-selected="true">4-Digit</button>
    <button class="tab" data-mode="random" role="tab" aria-selected="false">Random Draw</button>
    <button class="tab" data-mode="custom" role="tab" aria-selected="false">Custom</button>
  </nav>

  <!-- Mode 1: fixed 4 digits + target, entered by hand -->
  <section class="mode is-active" id="mode-classic">
    <p class="mode__hint">Enter four digits and a target. FastMath will try to reach it.</p>
    <div class="digit-row" id="classic-digits">
      <input type="number" class="digit-input" min="0" max="9" inputmode="numeric" placeholder="0">
      <input type="number" class="digit-input" min="0" max="9" inputmode="numeric" placeholder="0">
      <input type="number" class="digit-input" min="0" max="9" inputmode="numeric" placeholder="0">
      <input type="number" class="digit-input" min="0" max="9" inputmode="numeric" placeholder="0">
    </div>
    <div class="target-row">
      <label for="classic-target">Target</label>
      <input type="number" id="classic-target" class="target-input" min="1" placeholder="e.g. 42">
    </div>
    <button class="solve-btn" data-solve-for="classic">Solve</button>
  </section>

  <!-- Mode 2: same shape, but numbers are rolled for you -->
  <section class="mode" id="mode-random">
    <p class="mode__hint">Four digits and a target, generated for you.</p>
    <div class="digit-row" id="random-digits">
      <input type="number" class="digit-input" min="0" max="9" readonly>
      <input type="number" class="digit-input" min="0" max="9" readonly>
      <input type="number" class="digit-input" min="0" max="9" readonly>
      <input type="number" class="digit-input" min="0" max="9" readonly>
    </div>
    <div class="target-row">
      <label for="random-target">Target</label>
      <input type="number" id="random-target" class="target-input" readonly>
    </div>
    <div class="btn-row">
      <button class="roll-btn" id="roll-btn">Roll new numbers</button>
      <button class="solve-btn" data-solve-for="random">Solve</button>
    </div>
  </section>

  <!-- Mode 3: any count of numbers -->
  <section class="mode" id="mode-custom">
    <p class="mode__hint">Add as many numbers as you want, then set a target.</p>
    <div class="digit-row digit-row--wrap" id="custom-digits">
      <input type="number" class="digit-input" placeholder="0">
      <input type="number" class="digit-input" placeholder="0">
      <input type="number" class="digit-input" placeholder="0">
    </div>
    <div class="btn-row">
      <button class="ghost-btn" id="add-number-btn">+ Add number</button>
      <button class="ghost-btn" id="remove-number-btn">- Remove</button>
    </div>
    <div class="target-row">
      <label for="custom-target">Target</label>
      <input type="number" id="custom-target" class="target-input" min="1" placeholder="e.g. 100">
    </div>
    <button class="solve-btn" data-solve-for="custom">Solve</button>
  </section>

  <section class="result" id="result" hidden>
    <div class="result__value" id="result-value"></div>
    <div class="result__expr" id="result-expr"></div>
    <div class="result__note" id="result-note"></div>
  </section>

  <footer class="footer">
  <span>By Krittikun, aka Candyest</span>
  <a href="https://github.com/candydaisy/fastmath-solver" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
